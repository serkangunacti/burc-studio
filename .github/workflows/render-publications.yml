name: Ham ses eşleştirmesi doğrulaması
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: .cache/voice
          key: voice-v4-2026-10-09-37923586596-1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python3 -m pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python3 -m pip install stable-ts==2.19.1
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/whisper
          key: whisper-small-tr-v1
      - name: Aynı tam ham ses üzerinde sahneleri doğrula
        run: |
          python3 - <<'PY'
          import json, wave, pathlib, subprocess
          root=pathlib.Path(".cache/voice")
          def duration(p):
              with wave.open(str(p)) as w: return w.getnframes()/w.getframerate()
          raw=next(p for p in root.glob("*.wav") if abs(duration(p)-309.2)<.02)
          fitted=root/"12085e8642275277a63f0c2aa041d23512958287c78b2491cddd9d5c02cc127b-tempo.wav"
          manifest=root/"aa107e834eafcb1f347151b7f0f75910329cd02f439b10143e12a2b64697dd3b-timing.json.manifest.json"
          request=json.loads(manifest.read_text())
          request["durationSeconds"]=duration(raw)
          request["minimumSceneGapSeconds"]*=duration(raw)/duration(fitted)
          test_manifest=pathlib.Path("/tmp/raw-manifest.json")
          test_manifest.write_text(json.dumps(request))
          output=pathlib.Path("/tmp/raw-aligned.json")
          subprocess.run(["python3","scripts/automation/align-narration.py",str(raw),str(test_manifest),str(output)],check=True)
          starts=json.loads(output.read_text())["sceneStarts"]
          scaled=[x*duration(fitted)/duration(raw) for x in starts]
          assert len(scaled)==14 and scaled[0]==0 and all(b-a>=1 for a,b in zip(scaled,scaled[1:]))
          print(json.dumps({"rawDuration":duration(raw),"finalDuration":duration(fitted),"sceneStarts":scaled,"scenes":14}))
          PY
