name: Paylaşımları hazırla

# Her sabah günün gönderilerini carousel parçaları ve Reels olarak çizer, Telegram onayına gönderir.
on:
  schedule:
    # 06:07 TSİ; günlük üretim cron'u 05:00–05:59 TSİ arasında çalışır, betik eksik gönderiyi bekler.
    # GitHub zamanlanmış işleri geciktirebilir ya da atlayabilir; yedek tetiklemeler hazır günü yeniden çizmez ve ikinci mesaj göndermez.
    - cron: '7 3 * * *'
    - cron: '37 3 * * *'
    - cron: '7 4 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Tarih (YYYY-AA-GG, boşsa bugün)'
        required: false
      force:
        description: 'Onaylanmamış hazır paylaşımları yeniden çiz'
        type: boolean
        default: false

concurrency:
  group: render-publications
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Başlangıç tarihini kontrol et
        id: start-window
        run: node --import tsx scripts/check-automation-start.ts
        env:
          RENDER_DATE: ${{ inputs.date }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Tamamlanmış ve bekleyen konuşmaları geri yükle
        uses: actions/cache/restore@v4
        if: steps.start-window.outputs.allowed == 'true'
        with:
          path: .cache/serkanses
          key: serkanses-v1-${{ steps.start-window.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            serkanses-v1-${{ steps.start-window.outputs.date }}-
      # Açıklama ve kancalardaki emojiler için renkli emoji yazı tipi.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-color-emoji
        if: steps.start-window.outputs.allowed == 'true'
      - uses: actions/cache@v4
        if: steps.start-window.outputs.allowed == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: steps.start-window.outputs.allowed == 'true'
      - run: npx remotion browser ensure
        if: steps.start-window.outputs.allowed == 'true'
      - name: Çiz ve onaya gönder
        if: steps.start-window.outputs.allowed == 'true'
        run: node --import tsx scripts/render-publications.ts
        env:
          RENDER_DATE: ${{ inputs.date }}
          RENDER_FORCE: ${{ inputs.force }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          # Giriş/kapanış bir kez üretilir; burç yorumları ücretsiz serviste ve runner'da hazırlanır.
          SERKANSES_VOICE_ASSET: ${{ secrets.SERKANSES_VOICE_ASSET }}
          SERKANSES_REFERENCE_01: ${{ secrets.SERKANSES_REFERENCE_01 }}
          SERKANSES_REFERENCE_02: ${{ secrets.SERKANSES_REFERENCE_02 }}
          SERKANSES_REFERENCE_03: ${{ secrets.SERKANSES_REFERENCE_03 }}
          SERKANSES_REFERENCE_04: ${{ secrets.SERKANSES_REFERENCE_04 }}
          SERKANSES_REFERENCE_05: ${{ secrets.SERKANSES_REFERENCE_05 }}
          SERKANSES_REFERENCE_06: ${{ secrets.SERKANSES_REFERENCE_06 }}
          SERKANSES_REFERENCE_07: ${{ secrets.SERKANSES_REFERENCE_07 }}
          SERKANSES_REFERENCE_08: ${{ secrets.SERKANSES_REFERENCE_08 }}
          SERKANSES_REFERENCE_09: ${{ secrets.SERKANSES_REFERENCE_09 }}
          SERKANSES_REFERENCE_10: ${{ secrets.SERKANSES_REFERENCE_10 }}
          SERKANSES_REFERENCE_11: ${{ secrets.SERKANSES_REFERENCE_11 }}
          SERKANSES_REFERENCE_12: ${{ secrets.SERKANSES_REFERENCE_12 }}
          SERKANSES_REFERENCE_13: ${{ secrets.SERKANSES_REFERENCE_13 }}
          SERKANSES_REFERENCE_14: ${{ secrets.SERKANSES_REFERENCE_14 }}
          SERKANSES_REFERENCE_15: ${{ secrets.SERKANSES_REFERENCE_15 }}
          SERKANSES_REFERENCE_16: ${{ secrets.SERKANSES_REFERENCE_16 }}
          SERKANSES_REFERENCE_17: ${{ secrets.SERKANSES_REFERENCE_17 }}
          SERKANSES_REFERENCE_18: ${{ secrets.SERKANSES_REFERENCE_18 }}
          SERKANSES_REFERENCE_19: ${{ secrets.SERKANSES_REFERENCE_19 }}
          SERKANSES_NARRATION_START: '2026-10-06'
          SERKANSES_CACHE_DIR: .cache/serkanses
          AUTOMATION_SECRET: ${{ secrets.AUTOMATION_SECRET }}
          APP_URL: https://burc-studio.vercel.app
      - name: Konuşmaları hata durumunda da sakla
        uses: actions/cache/save@v4
        if: always() && steps.start-window.outputs.allowed == 'true'
        with:
          path: .cache/serkanses
          key: serkanses-v1-${{ steps.start-window.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
