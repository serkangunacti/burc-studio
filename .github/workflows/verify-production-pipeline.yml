name: Üretim akışını doğrula
on:
  push:
    branches: [codex/finish-production-1001]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Üretim kurallarını test et
        run: |
          npx vitest run scripts/automation/google-tts.test.ts scripts/automation/full-narration.test.ts scripts/automation/remotion.test.ts scripts/automation/video-duration.test.ts scripts/automation/quota-reset.test.ts scripts/automation/schedule-preflight.test.ts src/remotion/voice.test.ts src/lib/automation/render-job.test.ts src/lib/automation/publishing-policy.test.ts src/lib/content/daily-package.test.ts src/lib/automation/plan.test.ts --maxWorkers=2
          npm run typecheck
          npx eslint scripts/automation/full-narration.ts scripts/automation/google-tts.ts scripts/automation/remotion.ts scripts/automation/video-duration.ts scripts/automation/quota-reset.mjs scripts/automation/schedule-preflight.mjs scripts/render-publications.ts src/lib/automation/plan.ts src/lib/automation/render-job.ts src/lib/automation/service.ts src/remotion/reels.ts src/remotion/voice.ts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python3 -m pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install stable-ts==2.19.1
          python3 -B scripts/automation/align-narration.test.py
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/whisper
          key: whisper-small-tr-v1
      - name: Eski başarısız sesi yalnız hata tekrar testi için yükle
        uses: actions/cache/restore@v4
        with:
          path: .cache/voice
          key: voice-v3-2026-10-09-37869486374-1
          fail-on-cache-miss: true
      - name: Gerçek erkek tarot hatasını aynı tam ses üzerinde tekrar doğrula
        run: |
          python3 scripts/automation/align-narration.py .cache/voice/c14b718bde7208725bb9a0e9bb194909f300c6c5cb7c208b3e6d1c13653fb3ee.wav .cache/voice/386841ae1ffb15f83e07c6f3fbcddd0d1dce0ce9a1a640712ceb9eb5992246c0-timing.json.manifest.json .cache/voice/reproduction-verified.json
          python3 -c 'import json; d=json.load(open(".cache/voice/reproduction-verified.json")); assert len(d["sceneStarts"])==14; print("14 gerçek sahne doğrulandı")'
      # TTS, video render, Blob yükleme ve sosyal paylaşım bu işte yapılmaz.
  reset-old-videos:
    needs: verify
    if: github.ref == 'refs/heads/codex/finish-production-1001'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Onaylı eski videoları temizle ve bugünün sıfırdan üretimini hazırla
        run: node scripts/automation/reset-generated-videos.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          CONFIRM_RESET_GENERATED_VIDEOS: '2026-10-09'
