name: Tüm Videoları ve Kuyruğu Temizle

on:
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Vercel Blob ve Yayın Kayıtlarını Temizle
        run: node scripts/automation/clean-all-reels.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
