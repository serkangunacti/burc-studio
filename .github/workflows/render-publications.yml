name: Ham ses eşleştirmesi doğrulaması
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: .cache/voice
          key: voice-v4-2026-10-09-37923586596-1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python3 -m pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python3 -m pip install stable-ts==2.19.1
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/whisper
          key: whisper-small-tr-v1
      - name: Aynı tam ham ses üzerinde sahneleri doğrula
        run: |
          python3 - <<'PY'
          import json, wave, pathlib, subprocess
          root=pathlib.Path(".cache/voice")
          def duration(p):
              with wave.open(str(p)) as w: return w.getnframes()/w.getframerate()
          raw=next(p for p in root.glob("*.wav") if abs(duration(p)-309.2)<.02)
          fitted=root/"12085e8642275277a63f0c2aa041d23512958287c78b2491cddd9d5c02cc127b-tempo.wav"
          manifest=root/"aa107e834eafcb1f347151b7f0f75910329cd02f439b10143e12a2b64697dd3b-timing.json.manifest.json"
          request=json.loads(manifest.read_text())
          request["durationSeconds"]=duration(raw)
          request["minimumSceneGapSeconds"]*=duration(raw)/duration(fitted)
          test_manifest=pathlib.Path("/tmp/raw-manifest.json")
          test_manifest.write_text(json.dumps(request))
          output=pathlib.Path("/tmp/raw-aligned.json")
          import importlib.util, torch, stable_whisper
          torch.set_num_threads(2)
          spec=importlib.util.spec_from_file_location("alignment","scripts/automation/align-narration.py")
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          model=stable_whisper.load_model("small",device="cpu")
          print(json.dumps({"originalLastScenes":request["scenes"][10:]},ensure_ascii=False),flush=True)
          for index,(a,b) in enumerate([(250,309.2)]):
              fragment=f"/tmp/fragment-{index}.wav"
              subprocess.run(["ffmpeg","-nostdin","-v","error","-y","-ss",str(a),"-to",str(b),"-i",str(raw),fragment],check=True)
              transcript=model.transcribe(fragment,language="tr",verbose=None,word_timestamps=False)
              print(json.dumps({"fragment":index,"start":a,"end":b,"transcription":transcript.text},ensure_ascii=False),flush=True)
          result=model.align(str(raw),"\n".join(request["scenes"]),language="tr",original_split=True,verbose=None,remove_instant_words=False,token_step=400,nonspeech_skip=None,fast_mode=True)
          segments=module.rebuild_scene_segments(result.to_dict()["segments"],request["scenes"])
          print(json.dumps({"fastModeAnchors":[{"scene":i,"start":float(s["words"][0]["start"]),"end":float(s["words"][-1]["end"]),"positiveWords":int(sum(w["end"]>w["start"] for w in s["words"])),"words":len(s["words"])} for i,s in enumerate(segments)]}),flush=True)
          starts=module.scene_starts(segments,request["scenes"],request["durationSeconds"],request["minimumSceneGapSeconds"])
          output.write_text(json.dumps({"sceneStarts":[float(x) for x in starts]}))
          starts=json.loads(output.read_text())["sceneStarts"]
          scaled=[x*duration(fitted)/duration(raw) for x in starts]
          assert len(scaled)==14 and scaled[0]==0 and all(b-a>=1 for a,b in zip(scaled,scaled[1:]))
          print(json.dumps({"rawDuration":duration(raw),"finalDuration":duration(fitted),"sceneStarts":scaled,"scenes":14}))
          PY
