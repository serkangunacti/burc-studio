name: Paylaşımları hazırla

# Her sabah yalnız Reels/video hazırlar; bugünün özel Telegram onayı ve sonraki günlerin otomatik paylaşım kuralı uygulamada denetlenir.
on:
  schedule:
    # 04:00 TSİ; günlük üretim de 04:00 TSİ başlar, betik eksik gönderileri bekler.
    # 05:30 ve 07:00 TSİ yedekleri, 08:30 hazırlık hedefi için kurtarma aralığı bırakır.
    # GitHub zamanlanmış işleri geciktirebilir ya da atlayabilir; yedek tetiklemeler hazır günü yeniden çizmez ve ikinci mesaj göndermez.
    - cron: '0 1 * * *'
    - cron: '30 2 * * *'
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Tarih (YYYY-AA-GG, boşsa bugün)'
        required: false
      force:
        description: 'Onaylanmamış hazır paylaşımları yeniden çiz'
        type: boolean
        default: false
      only:
        description: 'Yalnız bu gönderiyi çiz (ör: horoscope-kadin, boşsa tümü)'
        required: false

concurrency:
  group: render-publications
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Başlangıç tarihini kontrol et
        id: start-window
        run: node --import tsx scripts/check-automation-start.ts
        env:
          RENDER_DATE: ${{ inputs.date }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Tamamlanmış ve bekleyen konuşmaları geri yükle
        uses: actions/cache/restore@v4
        if: steps.start-window.outputs.allowed == 'true'
        with:
          path: .cache/voice
          key: voice-v2-${{ steps.start-window.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            voice-v2-${{ steps.start-window.outputs.date }}-
      # Açıklama ve kancalardaki emojiler için renkli emoji yazı tipi.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-color-emoji ffmpeg && ffprobe -version
        if: steps.start-window.outputs.allowed == 'true'
      - uses: actions/cache@v4
        if: steps.start-window.outputs.allowed == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: steps.start-window.outputs.allowed == 'true'
      - run: npx remotion browser ensure
        if: steps.start-window.outputs.allowed == 'true'
      - name: Videoları hazırla ve Telegram’a bildir
        if: steps.start-window.outputs.allowed == 'true'
        run: node --import tsx scripts/render-publications.ts
        env:
          RENDER_DATE: ${{ inputs.date }}
          RENDER_FORCE: ${{ inputs.force }}
          RENDER_ONLY: ${{ inputs.only }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          SERKANSES_VOICE_ASSET: ${{ secrets.SERKANSES_VOICE_ASSET }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          VOICE_CACHE_DIR: .cache/voice
          AUTOMATION_SECRET: ${{ secrets.AUTOMATION_SECRET }}
          APP_URL: https://burc-studio.vercel.app
      - name: Konuşmaları hata durumunda da sakla
        uses: actions/cache/save@v4
        if: always() && steps.start-window.outputs.allowed == 'true'
        with:
          path: .cache/voice
          key: voice-v2-${{ steps.start-window.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
